name: NPM audit

on: [workflow_dispatch]

jobs:
  Test-job:
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup nodejs
        uses: actions/setup-node@v3
        with: 
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Audit deps
        run: npm audit
